services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-que_user}:${POSTGRES_PASSWORD:-que_pass}@postgres:5432/${POSTGRES_DB:-que_db}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-que_user}:${POSTGRES_PASSWORD:-que_pass}@postgres:5432/${POSTGRES_DB:-que_db}
      REDIS_URL: redis://redis:6379
      PORT: "8000"
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["node", "dist/main.js"]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-que_user}:${POSTGRES_PASSWORD:-que_pass}@postgres:5432/${POSTGRES_DB:-que_db}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["node", "dist/worker/main.js"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-que_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-que_pass}
      POSTGRES_DB: ${POSTGRES_DB:-que_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-que_user} -d $${POSTGRES_DB:-que_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
